name: Deploy dev

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build --workspace frontend
      # TODO once repo + AWS OIDC role exist:
      # - uses: aws-actions/configure-aws-credentials@v4
